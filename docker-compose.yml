version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: telangana_road_db
    environment:
      POSTGRES_DB: telangana_road_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telangana_road_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: telangana_road_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/telangana_road_db
      - TELANGANA_GIS_BASE_URL=https://gis.telangana.gov.in/arcgis/rest/services
      - TELANGANA_OPEN_DATA_BASE_URL=https://data.telangana.gov.in/api/v1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
